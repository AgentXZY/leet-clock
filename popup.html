<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #1a1a1a;
      color: #ffffff;
      text-align: center;
    }
    .timer-card {
      background-color: #262626;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .timer-label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .timer-display {
      font-size: 24px;
      font-weight: bold;
      color: #00FF66;
      font-family: monospace;
      margin-top: 4px;
    }
    .section-title {
      font-size: 11px;
      color: #FFA116;
      font-weight: bold;
      text-align: left;
      margin-bottom: 6px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
    .solved-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .problem-badge {
      background-color: #333;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .problem-badge a {
      color: #4caf50;
      text-decoration: none;
    }
    .problem-badge a:hover {
      text-decoration: underline;
      color: #00FF66;
    }
    .problem-time {
      font-size: 11px;
      color: #aaa;
      font-weight: normal;
    }
    .empty {
      font-size: 11px;
      color: #666;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <div class="timer-label">Current Session</div>
    <div id="live-timer" class="timer-display">00:00</div>
  </div>

  <div class="section-title">Last 10 Solved</div>
  <div id="solved-list" class="solved-grid"></div>

  <script src="popup.js"></script>
</body>
</html>

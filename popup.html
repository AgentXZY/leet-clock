<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Passion+One:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #171230 0%, #372052 48%, #7d356b 84%, #c95b76 100%);
      --card-bg: rgba(16, 11, 30, 0.76);
      --card-hover: rgba(26, 18, 48, 0.92);
      --border-color: rgba(255, 182, 217, 0.22);
      --accent-pink: #ff7eb3;
      --accent-glow: rgba(255, 126, 179, 0.5);
      --accent-gold: #ffd180;
      --text-main: #ffffff;
      --text-muted: #f3d1f4;
      --text-dim: #b88ebf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 245px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px 14px 14px;
      background: var(--bg-gradient);
      color: var(--text-main);
      text-align: center;
    }

    /* Sleek, Compact Stacked Emblem */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    .vice-logo-svg {
      width: 108px;
      height: 54px;
      filter: drop-shadow(0 0 6px rgba(255, 126, 179, 0.55));
      overflow: visible;
    }

    .logo-wordmark {
      font-family: 'Passion One', 'Impact', sans-serif;
      font-weight: 900;
      fill: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .timer-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(12, 7, 26, 0.45);
    }

    .timer-label {
      font-size: 9.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-weight: 600;
    }

    .timer-display {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 3px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px var(--accent-glow), 0 0 3px #ff5e9e;
    }

    .section-title {
      font-size: 9.5px;
      color: var(--accent-gold);
      font-weight: 700;
      text-align: left;
      margin-bottom: 7px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .solved-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 195px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .solved-grid::-webkit-scrollbar {
      width: 3px;
    }
    .solved-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    .solved-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .problem-badge {
      background-color: var(--card-bg);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-color);
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .problem-badge:hover {
      background-color: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .problem-badge a {
      color: #ff9ec7;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .problem-badge a:hover {
      color: #ffffff;
    }

    .problem-time {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }

    .empty {
      font-size: 11px;
      color: var(--text-dim);
      padding: 12px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="logo-wrapper">
    <svg class="vice-logo-svg" viewBox="0 0 180 88" xmlns="http://www.w3.org/2000/svg">
      <!-- Sleek Thin Neon Monogram Frame -->
      <path d="M 24 10 L 44 10 L 60 58 L 76 10 L 95 10 L 68 78 L 51 78 Z" 
            fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.2" stroke-linejoin="miter"/>
      <path d="M 150 24 L 150 10 L 107 10 L 107 78 L 150 78 L 150 63" 
            fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.2" stroke-linejoin="miter"/>

      <!-- Tightly Stacked Wordmark with Heavy Dark Outline + Slight Cascading Offset -->
      <text x="86" y="36" text-anchor="middle" class="logo-wordmark" font-size="27" stroke="#180e2e" stroke-width="3.2" paint-order="stroke">LEET</text>
      <text x="92" y="57" text-anchor="middle" class="logo-wordmark" font-size="27" stroke="#180e2e" stroke-width="3.2" paint-order="stroke">CLOCK</text>
      <text x="89" y="75" text-anchor="middle" class="logo-wordmark" font-size="20" fill="#ffd180" stroke="#180e2e" stroke-width="2.8" paint-order="stroke">VICE</text>
    </svg>
  </div>

  <div class="timer-card">
    <div class="timer-label">Current Session</div>
    <div id="live-timer" class="timer-display">00:00</div>
  </div>

  <div class="section-title">Last 10 Solved</div>
  <div id="solved-list" class="solved-grid"></div>

  <script src="popup.js"></script>
</body>
</html>
